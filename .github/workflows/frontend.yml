name: frontend CI

on:
  push:
    branches:
      - main
    paths:
      - '3-tier-app-eks/frontend/**'

jobs:

  build:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: test the code
        run: npm test

Build:
  name: Build Docker Image
  needs: test
  runs-on: ubuntu-latest

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: 3-tier-app-eks/frontend # Path to the folder containing the Dockerfile
        file: 3-tier-app-eks/frontend/Dockerfile # Path to the Dockerfile
        push: false
        tags: my-app:latest

    - name: Build Docker Image
      run: |
        docker build -t my-app:latest -f 3-tier-app-eks/frontend/Dockerfile 3-tier-app-eks/frontend

    - name: Scan Image with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: my-app:latest 
        format: table
        exit-code: 0
        ignore-unfixed: true
        severity: CRITICAL,HIGH

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag Docker Image
      run: |
        docker tag my-app:latest \
         ${{ secrets.DOCKER_USERNAME }}/my-frontend:latest

    - name: Push Docker Image
      run: |
        docker push \
          ${{ secrets.DOCKER_USERNAME }}/my-frontend:latest

