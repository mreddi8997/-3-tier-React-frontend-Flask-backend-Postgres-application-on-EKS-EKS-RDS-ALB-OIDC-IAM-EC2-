name: frontend CI

on: workflow_dispatch
    

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 3-tier-app-eks/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: 3-tier-app-eks/frontend
        run: npm install

      - name: Test the code
        working-directory: 3-tier-app-eks/frontend
        run: npm test
        continue-on-error: true

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: 3-tier-app-eks/frontend
          file: 3-tier-app-eks/frontend/Dockerfile
          push: false
          tags: my-app:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: my-app:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag my-app:latest \
            ${{ secrets.DOCKER_USERNAME }}/my-frontend:latest

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/my-frontend:latest
