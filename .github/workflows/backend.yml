name: Build, Scan and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 3-tier-app-eks/backend/requirements.txt

      - name: Run Tests
        run: |
          echo "test completed successfully"

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: 3-tier-app-eks/backend # Path to the folder containing the Dockerfile
          file: 3-tier-app-eks/backend/Dockerfile # Path to the Dockerfile
          push: false
          tags: my-app:latest

      - name: Build Docker Image
        run: |
          docker build -t my-app:latest -f 3-tier-app-eks/backend/Dockerfile ./backend

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: my-backend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag my-backend:latest \
            ${{ secrets.DOCKER_USERNAME }}/my-backend:latest

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/my-backend:latest
